<!DOCTYPE html>
<html lang="ru">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, maximum-scale=1, viewport-fit=cover">
<title>Тренажёр к к/р: Введение в философию</title>
<script src="https://telegram.org/js/telegram-web-app.js"></script>
<style>
:root{
  /* Цвета берутся из темы Telegram; в обычном браузере — запасные */
  --bg: var(--tg-theme-bg-color, #ffffff);
  --bg2: var(--tg-theme-secondary-bg-color, #f1f3f2);
  --text: var(--tg-theme-text-color, #15201b);
  --hint: var(--tg-theme-hint-color, #6b7a72);
  --link: var(--tg-theme-link-color, #1f6f8b);
  --btn: var(--tg-theme-button-color, #1f6f8b);
  --btntext: var(--tg-theme-button-text-color, #ffffff);
  --ok: #2e8b57;
  --bad: #c8382e;
  --part: #c98a00;
  --line: rgba(127,127,127,.25);
}
*{box-sizing:border-box;-webkit-tap-highlight-color:transparent}
html,body{margin:0;background:var(--bg2);color:var(--text);font-family:-apple-system,"Segoe UI",Roboto,"PT Sans",Arial,sans-serif;font-size:17px;line-height:1.45}
body{padding:0 0 calc(24px + env(safe-area-inset-bottom))}
button{font:inherit;color:inherit;cursor:pointer;border:0;background:none}
button:focus-visible{outline:2px solid var(--btn);outline-offset:2px}
.wrap{max-width:720px;margin:0 auto;padding:12px 14px}
.card{background:var(--bg);border-radius:14px;padding:14px 16px;margin-bottom:10px}
h1{font-size:22px;margin:4px 0 2px;line-height:1.2}
h2{font-size:19px;margin:0 0 8px;line-height:1.25}
.muted{color:var(--hint);font-size:14px}
.stats{display:grid;grid-template-columns:repeat(3,1fr);gap:8px;margin-top:12px}
.stat{background:var(--bg2);border-radius:10px;padding:8px;text-align:center}
.stat b{display:block;font-size:20px;font-variant-numeric:tabular-nums}
.stat span{font-size:12px;color:var(--hint)}
.bigbtns{display:grid;grid-template-columns:1fr 1fr;gap:8px}
.bigbtn{background:var(--bg);border-radius:14px;padding:14px;text-align:left;display:flex;flex-direction:column;gap:2px;min-height:76px}
.bigbtn b{font-size:16px}
.bigbtn span{font-size:13px;color:var(--hint)}
.list{background:var(--bg);border-radius:14px;overflow:hidden;margin-bottom:10px}
.row{display:flex;align-items:center;gap:12px;width:100%;text-align:left;padding:12px 16px;border-bottom:1px solid var(--line)}
.row:last-child{border-bottom:0}
.row .t{flex:1;min-width:0}
.row .t div:first-child{font-weight:600}
.row .t div:last-child{font-size:13px;color:var(--hint)}
.ring{width:38px;height:38px;flex:none}
.sectitle{font-size:13px;text-transform:uppercase;letter-spacing:.05em;color:var(--hint);margin:16px 4px 6px}
.bar{height:6px;background:var(--line);border-radius:4px;overflow:hidden;margin:6px 0 2px}
.bar i{display:block;height:100%;background:var(--btn)}
.top{display:flex;align-items:center;gap:10px;margin-bottom:8px}
.back{color:var(--link);padding:6px 0;font-size:16px}
.qhead{font-size:13px;color:var(--hint);margin-bottom:6px}
.q{font-size:17px;font-weight:600;margin:0 0 12px}
.opt{display:flex;gap:10px;width:100%;text-align:left;padding:11px 12px;border:1.5px solid var(--line);border-radius:12px;margin-bottom:8px;background:var(--bg)}
.opt .n{flex:none;width:26px;height:26px;border-radius:8px;border:1.5px solid var(--line);display:flex;align-items:center;justify-content:center;font-weight:700;font-size:14px}
.opt.sel{border-color:var(--btn)}
.opt.sel .n{background:var(--btn);color:var(--btntext);border-color:var(--btn)}
.opt.ok{border-color:var(--ok)} .opt.ok .n{background:var(--ok);border-color:var(--ok);color:#fff}
.opt.bad{border-color:var(--bad)} .opt.bad .n{background:var(--bad);border-color:var(--bad);color:#fff}
.opt.miss{border-style:dashed;border-color:var(--ok)}
.opt .why{display:block;margin-top:6px;font-size:14px;color:var(--bad)}
.opt .body{flex:1;min-width:0}
.rlist{background:var(--bg2);border-radius:12px;padding:10px 12px;margin-bottom:12px}
.rlist div{margin:3px 0}
.rlist b{color:var(--link)}
.mrow{border:1.5px solid var(--line);border-radius:12px;padding:10px 12px;margin-bottom:8px}
.mrow.ok{border-color:var(--ok)} .mrow.bad{border-color:var(--bad)}
.mrow .l{margin-bottom:8px}
.mrow .l b{color:var(--link);margin-right:4px}
.chips{display:flex;flex-wrap:wrap;gap:6px}
.chip{min-width:40px;height:38px;padding:0 10px;border-radius:10px;border:1.5px solid var(--line);font-weight:700;background:var(--bg)}
.chip.sel{background:var(--btn);color:var(--btntext);border-color:var(--btn)}
.chip.ok{background:var(--ok);color:#fff;border-color:var(--ok)}
.chip.bad{background:var(--bad);color:#fff;border-color:var(--bad)}
.main{display:block;width:100%;padding:14px;border-radius:12px;background:var(--btn);color:var(--btntext);font-weight:700;font-size:17px;margin-top:6px}
.main[disabled]{opacity:.45}
.ghost{display:block;width:100%;padding:12px;border-radius:12px;background:var(--bg);color:var(--link);font-weight:600;margin-top:8px}
.verdict{border-radius:12px;padding:12px 14px;margin:10px 0;font-weight:600}
.verdict.ok{background:rgba(46,139,87,.13);color:var(--ok)}
.verdict.part{background:rgba(201,138,0,.14);color:var(--part)}
.verdict.bad{background:rgba(200,56,46,.12);color:var(--bad)}
.verdict small{display:block;font-weight:400;color:var(--text);margin-top:4px;font-size:15px}
.expl{background:var(--bg2);border-radius:12px;padding:10px 12px;margin-top:8px;font-size:15px}
.expl p{margin:4px 0}
.expl b{color:var(--bad)}
textarea{width:100%;min-height:110px;border-radius:12px;border:1.5px solid var(--line);padding:10px 12px;font:inherit;color:var(--text);background:var(--bg);resize:vertical}
.sample{background:rgba(46,139,87,.1);border-radius:12px;padding:10px 12px;margin-top:10px}
.sample ol{margin:6px 0 0;padding-left:20px}
.sample li{margin:4px 0}
.selfcheck{margin-top:10px}
.confirm{display:flex;gap:8px;margin-top:8px}
.confirm button{flex:1;padding:12px;border-radius:12px;font-weight:700}
.danger{background:var(--bad);color:#fff}
.center{text-align:center}
.big{font-size:40px;font-weight:800;font-variant-numeric:tabular-nums}
.tag{display:inline-block;font-size:12px;padding:2px 8px;border-radius:999px;background:var(--bg2);color:var(--hint);margin-left:6px;vertical-align:middle}
.grid{display:grid;grid-template-columns:repeat(auto-fill,minmax(42px,1fr));gap:6px}
.gcell{height:42px;border-radius:10px;border:1.5px solid var(--line);background:var(--bg);font-weight:700;font-variant-numeric:tabular-nums}
.gcell.ok{background:rgba(46,139,87,.15);border-color:var(--ok);color:var(--ok)}
.gcell.bad{background:rgba(200,56,46,.12);border-color:var(--bad);color:var(--bad)}
.gcell.cur{outline:2.5px solid var(--btn);outline-offset:1px}
.legend{display:flex;flex-wrap:wrap;gap:14px;margin-top:10px;font-size:13px;color:var(--hint)}
.legend span{display:flex;align-items:center;gap:6px}
.legend i.gcell{display:inline-block;width:16px;height:16px;border-radius:5px}
.jump{color:var(--link);font-size:15px;padding:2px 0 8px}
#jg{margin-bottom:12px}
.toggle{display:flex;align-items:center;justify-content:space-between;gap:10px;padding:12px 16px;background:var(--bg);border-radius:14px;margin-bottom:10px}
.toggle input{width:22px;height:22px}
</style>
</head>
<body>
<div class="wrap" id="app"></div>
<script>
const TASKS = [{"sec": "1.1", "num": "1", "type": 1, "kind": "choice", "q": "Ниже приведён перечень качеств, присущих человеку. Все они, за исключением двух, имеют социальную природу. Найдите два термина, «выпадающих» из общего ряда.", "ans": "25", "opts": ["благожелательность", "тип темперамента", "самостоятельность в принятии решения", "толерантность", "чувствительность к теплу", "трудолюбие"]}, {"sec": "1.1", "num": "2", "type": 1, "kind": "choice", "q": "Ниже приведён перечень примеров. Все они, за исключением двух, относятся к биологическим потребностям человека. Найдите два термина, «выпадающих» из общего ряда.", "ans": "45", "opts": ["в воздухе для дыхания", "в самосохранении", "в жилище", "в дружбе", "в художественном творчестве", "в отдыхе"]}, {"sec": "1.1", "num": "3", "type": 1, "kind": "choice", "q": "Ниже приведён ряд терминов. Все они, за исключением двух, представляют духовные (идеальные) потребности человека. Найдите два термина, «выпадающих» из общего ряда.", "ans": "26", "opts": ["в саморазвитии", "в безопасности", "в познании мира и самого себя", "в нравственном поведении", "в красоте", "в труде"]}, {"sec": "1.1", "num": "4", "type": 1, "kind": "choice", "q": "Ниже приведены потребности человека. Все из них, за исключением двух, являются социальными потребностями. Найдите два термина, «выпадающих» из общего ряда.", "ans": "14", "opts": ["в воздухе для дыхания", "в созидании", "в общественном признании", "в познании самого себя", "в понимании со стороны других людей", "во власти"]}, {"sec": "1.1", "num": "5", "type": 2, "kind": "choice", "q": "Выберите верные суждения о человеке и запишите цифры, под которыми они указаны.", "ans": "14", "opts": ["К отличиям человека от других живых существ относят наличие мышления и словесной речи.", "Биологическая сущность человека проявляется через способность и готовность к общественно полезному труду и творчеству, сознание и разум, свободу и ответственность.", "Возможность приспосабливаться к изменяющимся природным условиям – черта отличия человека от других живых существ.", "К социальным качествам человека относят стремление к профессиональному успеху.", "Духовная природа человека проявляется в его анатомо-физиологических чертах, инстинктах и рефлексах."], "expl": {"2": "Это проявления социальной сущности человека; биологическая сущность проявляется в анатомии, физиологии, инстинктах.", "3": "Приспосабливаться к изменениям природы способны все живые существа; человек отличается тем, что преобразует среду.", "5": "Анатомо-физиологические черты, инстинкты и рефлексы — проявления биологической, а не духовной природы."}}, {"sec": "1.1", "num": "6", "type": 2, "kind": "choice", "q": "Выберите верные суждения о человеке и запишите цифры, под которыми они указаны.", "ans": "24", "opts": ["Все живые существа обладают способностью к целенаправленной, в том числе творческой, деятельности.", "Неповторимые, оригинальные качества человека называют индивидуальностью.", "Индивидуальные потребности человека всегда совпадают с потребностями общества, в котором он живёт.", "Конкретные условия, в которых живёт человек, влияют на особенности его характера.", "Отличием человека от других живых существ является то, что он обладает инстинктом самосохранения."], "expl": {"1": "Целенаправленная, творческая деятельность свойственна только человеку; животным присуща активность (поведение).", "3": "Потребности личности и общества могут не совпадать и даже противоречить друг другу.", "5": "Инстинкт самосохранения есть у всех живых существ, это не отличие человека."}}, {"sec": "1.1", "num": "7", "type": 2, "kind": "choice", "q": "Выберите верные суждения о человеке и запишите цифры, под которыми они указаны.", "ans": "234", "opts": ["К отличиям человека от других живых существ относят наличие инстинктов.", "Одна из особенностей человека – умение с помощью простых орудий создавать сложные орудия труда.", "Человека от живых существ отличает способность к деятельности.", "Характер человека проявляется в его поступках.", "Деятельность свойственна как человеку, так и животным."], "expl": {"1": "Инстинкты есть и у животных; отличие человека — сознание, речь, мышление, деятельность.", "5": "Деятельность — специфически человеческая форма активности; у животных — поведение."}}, {"sec": "1.1", "num": "8", "type": 2, "kind": "choice", "q": "Выберите верные суждения о человеке и запишите цифры, под которыми они указаны.", "ans": "235", "opts": ["Понятие «индивид» используется для характеристики отличительных особенностей одного человека от другого.", "Человеку свойственно наличие мышления и словесной речи.", "Только человек способен сознательно преобразовывать окружающую действительность, создавать необходимые ему ценности.", "На формирование личности влияют только семья и ближайшее окружение человека.", "Индивид – единичный представитель человечества."], "expl": {"1": "Своеобразие человека описывает понятие «индивидуальность»; индивид — отдельный представитель человеческого рода.", "4": "На личность влияют многие агенты социализации: школа, сверстники, СМИ, государство, культура и др."}}, {"sec": "1.1", "num": "9", "type": 2, "kind": "choice", "q": "Выберите верные суждения о биосоциальном в человеке и запишите цифры, под которыми они указаны.", "ans": "135", "opts": ["Биологическая природа человека проявляется в его анатомо-физиологических чертах.", "Человека и других живых существ объединяет возможность осуществлять преобразовательную деятельность.", "Каждый человек обладает биологической индивидуальностью.", "Только человек обладает способностью использовать предметы в процессе получения необходимых благ.", "Понятие «индивид» используется для обозначения единичного представителя человеческого рода."], "expl": {"2": "Преобразовательная деятельность свойственна только человеку.", "4": "Использовать предметы для получения благ могут и животные; человек отличается тем, что создаёт орудия труда."}}, {"sec": "1.1", "num": "10", "type": 2, "kind": "choice", "q": "Выберите верные суждения о человеке и запишите цифры, под которыми они указаны.", "ans": "1234", "opts": ["Под способностями учёные понимают особенности человека, которые позволяют ему наиболее успешно заниматься какой-либо деятельностью.", "Способности человека развиваются на основе задатков, данных ему от природы.", "Понятие «индивид» используется для характеристики человека как представителя биологического вида.", "Врождённые качества человека, на основе которых формируются те или иные способности, называют задатками.", "Целенаправленная деятельность свойственна как человеку, так и животным."], "expl": {"5": "Целенаправленная (сознательная) деятельность свойственна только человеку."}}, {"sec": "1.1", "num": "11", "type": 2, "kind": "choice", "q": "Выберите верные суждения о личности и её качествах и запишите цифры, под которыми они указаны.", "ans": "1235", "opts": ["Врождённые качества человека оказывают влияние на формирование личности.", "Индивид становится личностью в процессе социализации.", "Качества человека как личности проявляются прежде всего в его участии в жизни общества.", "Качества человека как личности проявляются прежде всего в особенностях мышления и памяти.", "Личности свойственно определённое мировоззрение."], "expl": {"4": "Мышление и память — психические процессы; личность проявляется в социально значимых качествах, мировоззрении, поступках."}}, {"sec": "1.1", "num": "12", "type": 2, "kind": "choice", "q": "Выберите верные суждения о качествах человека как личности и запишите цифры, под которыми они указаны.", "ans": "1345", "opts": ["Личность человека характеризуется определенной устойчивой системой мировоззренческих, психологических и поведенческих признаков.", "Личность формируется до трехлетнего возраста, все последующие этапы социализации не оказывают заметного влияния на развитие личности.", "Сознательное участие человека в общественной жизни характеризует его как личность.", "Человек как личность обладает способностью преобразовывать природную среду.", "Личность проявляет себя в поведении и активном взаимодействии с обществом."], "expl": {"2": "Становление личности продолжается всю жизнь; социализация длится на протяжении всей жизни."}}, {"sec": "1.1", "num": "13", "type": 2, "kind": "choice", "q": "Выберите верные суждения о личности и запишите цифры, под которыми они указаны.", "ans": "34", "opts": ["Начальный период становления личности – самореализация.", "Природные условия не влияют на становление личности человека.", "Личность отражает социальные характеристики человека.", "На формирование личности влияют конкретные социальные условия, в которых живет человек.", "О человеке как личности говорит его способность к продолжению рода."], "expl": {"1": "Самореализация — не начальный, а завершающий, высший этап; начальный — адаптация (усвоение норм).", "2": "Природные условия (среда, климат) тоже влияют на становление личности.", "5": "Продолжение рода — биологическая способность; личность характеризуют социальные качества."}}, {"sec": "1.1", "num": "14", "type": 2, "kind": "choice", "q": "Выберите верные суждения о человеке как личности и запишите цифры, под которыми они указаны.", "ans": "125", "opts": ["Социальные качества личности формируются в процессе труда и общения.", "Человеку как личности свойственна способность создавать новые предметы, не имеющие природных аналогов.", "Человек может стать личностью вне общества.", "Человека как личность в первую очередь характеризует протекание процессов психики.", "Развитие личности продолжается на протяжении всей жизни человека."], "expl": {"3": "Личностью человек становится только в обществе, в процессе социализации.", "4": "Психические процессы есть у каждого индивида; личность характеризуют социально значимые качества."}}, {"sec": "1.1", "num": "15", "type": 2, "kind": "choice", "q": "Выберите верные суждения о личности и запишите цифры, под которыми они указаны.", "ans": "1235", "opts": ["Коммуникативные качества непосредственно помогают человеку во взаимоде ие", "представление", "суждение"], "right": ["чувственное познание", "рациональное познание"], "rightH": "Уровни (этапы) познания"}, {"sec": "1.4", "num": "17", "type": 3, "kind": "match", "q": "Установите соответствие между этапами познания и иллюстрирующими их конкретными операциями.", "ans": "21122", "left": ["логический вывод новых суждений о предмете на основе имеющихся", "отражение в сознании человека внешних свойств предмета", "сохранение в памяти обобщенного образа предмета", "утверждение или отрицание наличия у предмета каких-либо свойств", "фиксация существенных свойств предмета"], "right": ["чувственное", "рациональное (логическое)"], "rightH": "Формы познания"}, {"sec": "1.4", "num": "18", "type": 3, "kind": "match", "q": "Установите соответствие между признаками и видами познания, которым они соответствуют.", "ans": "32241", "left": ["базируется на здравом смысле и обыденном сознании", "воспроизводимость результатов познания", "доказательность", "строится на образе, а не на понятии", "базируется на представлениях о сверхъестественном"], "right": ["мифологическое", "научное", "житейское", "художественное"], "rightH": "Виды познания"}, {"sec": "1.4", "num": "19", "type": 3, "kind": "match", "q": "Установите соответствие между признаками и видами познания, которым они соответствуют.", "ans": "13224", "left": ["опора на верования", "осуществляется нецеленаправленно, в процессе совершения бытовых действий", "проверяемость", "логическая обоснованность", "ярко выраженная эмоциональная окрашенность"], "right": ["мифологическое", "научное", "житейское", "художественное"], "rightH": "Виды познания"}, {"sec": "1.4", "num": "20", "type": 3, "kind": "match", "q": "Установите соответствие между характеристиками и методами, приемами мышления в каждой позиции, данной в первом столбце, подберите соответствующую позицию из второго столбца.", "ans": "32142", "left": ["Сделанное на основе сходства одних признаков сравниваемых объектов предположение о сходстве других признаков", "Выявление причинно-следственных связей мысленно выделенных отдельных элементов познаваемого объекта", "Отвлечение от второстепенных свойств предмета и изучение его наиболее важных свойств.", "Логические рассуждения, направленные от общего к частному", "Установление иерархических связей между мысленно выделенными элементами познаваемого объекта"], "right": ["абстрагирование", "анализ", "аналогия", "дедукция"], "rightH": "Методы, приемы мышления"}, {"sec": "1.4", "num": "21", "type": 3, "kind": "match", "q": "Установите соответствие между характеристиками и методами, приемами мышления в каждой позиции, данной в первом столбце, подберите соответствующую позицию из второго столбца.", "ans": "21431", "left": ["Мысленное объединение нескольких отдельных элементов в единое целое и изучение их как целостного предмета", "Умозаключение от частного к общему", "Мысленное сопоставление объектов, установление сходства и различия между ними", "Распределение объектов по группам в зависимости от их общих признаков", "Переход от единичных наблюдений и фактов к общим выводам, законам или гипотезам."], "right": ["индукция", "синтез", "классификация", "сравнение"], "rightH": "Методы, приемы мышления"}, {"sec": "1.5", "num": "1", "type": 2, "kind": "choice", "q": "Выберите верные суждения об истине и её критериях и запишите цифры, под которыми они указаны.", "ans": "34", "opts": ["Истинным признаётся любое знание, соответствующее интересам субъекта", "Истинно только знание, имеющее широкие возможности для распространения", "Истинным является знание, полученное в результате адекватного отражения объекта познающим субъектом", "Истина - это знание, воспроизводящее познаваемый объект таким, каким он существует независимо от сознания человека", "Истина - это любое знание, выраженное в доступной форме"], "expl": {"1": "Истина — знание, соответствующее объекту, а не интересам субъекта.", "2": "Распространённость знания не делает его истинным.", "5": "Доступность формы не является признак ыми они указаны.", "ans": "1245", "opts": ["Изменения в обществе могут происходить под влиянием различных внешних факторов.", "Возвращение общества к изжившим себя социальным структурам называют регрессом.", "Главным отличием реформы от революции является использование исключительно ненасильственных способов преобразования общества.", "Общественный прогресс имеет противоречивые последствия.", "Революция связана с радикальными быстрыми изменениями, со скачком в развитии общества."], "expl": {"3": "Реформы тоже могут проводиться с применением силы; главное отличие — постепенность и частичность изменений."}}, {"sec": "1.9", "num": "5", "type": 2, "kind": "choice", "q": "Выберите верные суждения об обществе и социальных изменениях и запишите цифры, под которыми они указаны.", "ans": "134", "opts": ["Реформы могут быть как прогрессивными, так и регрессивными.", "Реформа как форма социальных изменений, как правило, предполагает резкие качественные изменения общественных отношений.", "Общественный регресс представляет собой развитие социальных институтов и процессов от более сложных форм к простым.", "Общественный регресс характеризуется деградацией, возвратом к уже отжившим структурам и отношениям.", "Революция и реформа - это критерии общественного прогресса."], "expl": {"2": "Резкие качественные изменения характерны для революции; реформа — постепенные частичные преобразования.", "5": "Революция и реформа — формы социальных изменений, а не критерии прогресса."}}, {"sec": "1.9", "num": "6", "type": 2, "kind": "choice", "q": "Выберите верные суждения об обществе и его изменениях и запишите цифры, под которыми они указаны.", "ans": "2345", "opts": ["Общественный прогресс характеризуется деградацией, возвратом к уже отжившим структурам и отношениям.", "Развитие общества от менее совершенного к более совершенному называют прогрессом.", "Реформы предполагают изменения в какой-либо сфере общественной жизни.", "В обществе реализуются функции воспроизводства и социализации человека.", "B обществе постоянно возникают новые и отмирают старые элементы и связи между ними."], "expl": {"1": "Это регресс; прогресс — движение от простого к сложному, от низшего к высшему."}}, {"sec": "1.9", "num": "7", "type": 2, "kind": "choice", "q": "Выберите верные суждения об общественном развитии и запишите цифры, под которыми они указаны.", "ans": "123", "opts": ["Развитие производительных сил - один из критериев общественного прогресса.", "Социальные изменения происходят в течение некоторого времени внутри социальных систем и во взаимоотношениях между ними, в обществе в целом.", "Реформы проводятся органами государственной власти.", "Общество как систему характеризует обособленность, отсутствие связи элементов.", "Социальным регрессом называют направление развития от низших и простых форм общественной организации к более высоким и сложным."], "expl": {"4": "Общество как система характеризуется взаимосвязью элементов.", "5": "Это определение прогресса; регресс — движение от высшего к низшему."}}, {"sec": "1.9", "num": "8", "type": 2, "kind": "choice", "q": "Выберите верные суждения об общественном развитии и запишите цифры, под которыми они указаны.", "ans": "34", "opts": ["Революция как форма социальных изменений, как правило, направлена на частичное преобразование отдельных сторон общественной жизни.", "Развитие общества всегда имеет прогрессивный характер.", "Свобода личности, возможности для её самореализации свидетельствуют о прогрессе общества.", "Ряд учёных обосновали нравственный критерий прогресса.", "Гуманистический критерий прогресса связывают с ростом производства и повышением производительности труда."], "expl": {"1": "Частичные преобразования — реформа; революция ведёт к коренным изменениям.", "2": "Развитие общества противоречиво: возможны и прогресс, и регресс, и застой.", "5": "Гуманистический критерий — положение человека, его права и свободы; производство — экономический критерий."}}, {"sec": "1.9", "num": "9", "type": 2, "kind": "choice", те соответствие между признаками и видами (типами) культуры.", "ans": "13322", "left": ["анонимность создателей произведений", "включает в себя авангардные направления искусства", "высокая интеллектуальная и художественная сложность произведений", "коммерческий характер", "обилие спецэффектов, увлекательные сюжеты"], "right": ["народная", "массовая", "элитарная"], "rightH": "Виды (типы) культуры"}, {"sec": "1.10", "num": "11", "type": 3, "kind": "match", "q": "Установите соответствие между признаками и видами (типами) культуры.", "ans": "13223", "left": ["коллективность творческих процессов", "направленность произведений преимущественно на ценителей и знатоков", "опора на интерес людей к проблемам повседневной жизни", "ориентация на запросы широкого круга потребителей", "создается элитой или по ее заказу профессиональными творцами"], "right": ["народная", "массовая", "элитарная"], "rightH": "Виды (типы) культуры"}, {"sec": "1.10", "num": "12", "type": 3, "kind": "match", "q": "Установите соответствие между признаками и видами (типами) культуры.", "ans": "33122", "left": ["необходимость специальной подготовки для восприятия произведений", "ориентация на запросы узкого круга потребителей", "передача традиций предков", "упрощение смыслов в художественных образах", "приоритетное развитие развлекательных жанров"], "right": ["народная", "массовая", "элитарная"], "rightH": "Виды (типы) культуры"}, {"sec": "1.10", "num": "13", "type": 3, "kind": "match", "q": "Установите соответствие между признаками и видами (типами) культуры.", "ans": "32231", "left": ["ориентация исключительно на запросы знатоков, ценителей искусства", "развлекательный характер", "серийность, тиражируемость", "сложность содержания и художественных форм", "сохранение исторической преемственности"], "right": ["народная", "массовая", "элитарная"], "rightH": "Виды (типы) культуры"}, {"sec": "1.10", "num": "14", "type": 3, "kind": "match", "q": "Установите соответствие между признаками и видами (типами) культуры.", "ans": "13222", "left": ["обычно распространяется без записи, из уст в уста", "духовный аристократизм", "стандартизация содержания и художественных приёмов", "стандартизация духовных потребностей", "удовлетворение сиюминутных потребностей людей"], "right": ["народная", "массовая", "элитарная"], "rightH": "Виды (типы) культуры"}, {"sec": "1.10", "num": "15", "type": 3, "kind": "match", "q": "Установите соответствие между социальными фактами и формами культуры.", "ans": "12221", "left": ["конкурс фольклорных коллективов", "концерт эстрадной музыки", "переиздание детектива-бестселлера", "показ многосерийного телевизионного фильма", "празднование дня Ивана Купалы"], "right": ["народная", "массовая"], "rightH": "Виды (типы) культуры"}, {"sec": "1.10", "num": "16", "type": 4, "kind": "choice", "q": "Примерами народной культуры принято считать загадки, пословицы, приметы. Какие признаки позволяют отнести их к данному типу (виду, форме) культуры?", "ans": "1256", "opts": ["они не имеют персонального авторства", "установка на следование образцу, который перенимается от предшествующих поколений", "учёт запросов самых широких слоёв современного общества", "необходимость специальной подготовки для восприятия произведений", "они передавались из поколения в поколение, обогащаясь новыми сюжетами", "обобщение коллективного духовного опыта, накопленного веками"]}, {"sec": "1.10", "num": "17", "type": 4, "kind": "choice", "q": "В фильме украинского режиссёра присутствует национальный колорит. Какие признаки позволят сделать вывод о том, что это произведение относится к массовой культуре?", "ans": "145", "opts": ["понимание фильма не требует специальной подготовки", "автор предлагает философский взгляд на поведение человека в трудных жизненных обстоятельствах", "авторы используют народную музыку и эпические сюжеты", "фильм рассчитан на усреднённый потребительский вкус", "позиционирование фильма как продукта для отдыха и развлечения", "большое внимание к фильму со стороны критиков и знатоков"]}, {"sec": "1.10", "num": "18", "type": 4, "kind": "choice", "q": "Один из телевизионных каналов снял многосерийный фильм о работе пожарной части. Что из перечисленного позволяет отнести этот сериал к произведениям массовой культуры? характеристики массовой культуры.", "ans": "124", "opts": ["его создатели получили хорошую прибыль", "пропаганда традиционных семейных ценностей, понятных большинству зрителей", "телесериал интересен кругу знатоков", "СМИ представили фильм как удачный коммерческий проект", "телесериал снят благодаря государственному финансированию", "реализация создателями фильма в полной мере своей потребности в самовыражении, высказывании взглядов, не разделяемых большинством"]}, {"sec": "1.10", "num": "19", "type": 4, "kind": "choice", "q": "Государственный симфонический оркестр впервые исполнил симфонию современного композитора. Критики единодушно оценили музыкальное произведение как образец элитарной (высокой) культуры. Что позволило сделать им такой вывод? признаки произведений элитарной культуры.", "ans": "135", "opts": ["необходимость специальной подготовки для понимания смысла произведений", "высокая степень обобщения коллективного опыта", "оригинальность формы и (или) содержания", "использование спецэффектов", "внимание критиков и знатоков", "использование сюжетов народного эпоса"]}, {"sec": "1.10", "num": "20", "type": 4, "kind": "choice", "q": "Известный кинорежиссёр снял художественный фильм по пьесе классика русской литературы. Фильм был отнесён искусствоведами к произведениям элитарной (высокой) культуры. Что позволило сделать им такой вывод? признаки произведений элитарной культуры.", "ans": "346", "opts": ["привлечение кинозвёзд", "использование широко известных мифологических персонажей", "отсутствие ярко выраженной коммерческой направленности деятельности композитора и исполнителей", "обращение к узкому кругу ценителей", "колоссальный интерес зрителей", "отражение в произведении авторской индивидуальности"]}, {"sec": "1.10", "num": "21", "type": 4, "kind": "choice", "q": "Известный композитор написал оперу по мотивам народного эпоса. Критики единодушно оценили музыкальное произведение как образец элитарной культуры. Что позволило им сделать такой вывод? Запишите соответствующие цифры.", "ans": "2356", "opts": ["установка на следование образцу", "трудность восприятия произведения неподготовленными слушателями", "произведение требует знакомства с современными философскими концепциями", "стереотипизация отражения человеком реального мира в музыке", "ориентация на творческое самовыражение автора, имеющего свой особый взгляд на этот эпос", "сложность формы произведения и выразительных средств"]}, {"sec": "1.10", "num": "22", "type": 4, "kind": "choice", "q": "Представьте, что Вы получили задание оформить презентацию к уроку обществознания по теме «Духовная культура». Один из слайдов называется «Традиционные российские духовнонравственные ценности». Что из перечисленного Вы включили бы в этот слайд? российские традиционные ценности.", "ans": "236", "opts": ["юридическая ответственность", "единство народов России", "крепкая семья", "социализация", "повышение качества жизни граждан", "служение Отечеству и ответственность за его судьбу"]}, {"sec": "1.11", "num": "1", "type": 1, "kind": "choice", "q": "Ниже приведён ряд терминов. Все они, за исключением двух, относятся к понятию «мораль». Найдите два термина, «выпадающих» из общего ряда.", "ans": "13", "opts": ["писаный характер", "ответственность", "обоснованность", "свободный выбор", "общественное порицание", "санкции"]}, {"sec": "1.11", "num": "2", "type": 2, "kind": "choice", "q": "Выберите верные суждения о морали и запишите цифры, под которыми они указаны.", "ans": "1234", "opts": ["Деятельностный аспект морали заключается в практическом применении норм морали в поведении людей.", "Моралью называют сферу ценностей (оценок) и норм (правил), регулирующих жизнь людей с позиций гуманизма, добра и справедливости.", "Мораль помогает человек ) духовной культуры оказывает эмоциональное воздействие на человека.", "Компонентом научного знания являются этические оценки социальных явлений."], "expl": {"4": "Эмоциональное воздействие — признак искусства (и религии), а не науки.", "5": "Наука стремится к объективности; этические оценки — сфера морали."}}, {"sec": "1.12", "num": "6", "type": 2, "kind": "choice", "q": "Выберите верные суждения о науке и запишите цифры, под которыми они указаны.", "ans": "145", "opts": ["Целенаправленное систематическое восприятие явлений окружающего мира называется наблюдением.", "Основная функция науки связана с регулированием социального поведения людей.", "Наука, как и другие формы духовной культуры, вырабатывает и теоретически систематизирует объективные знания о действительности.", "Наука – особая форма деятельности человека, обеспечивающая получение и систематизацию нового знания.", "Наука помогает человеку рассматривать явления окружающего мира в их единстве и многообразии."], "expl": {"2": "Регулирование поведения — функция морали, права, религии; основная функция науки — получение знаний.", "3": "Объективные знания вырабатывает только наука; это её отличие от других форм культуры."}}, {"sec": "1.12", "num": "7", "type": 2, "kind": "choice", "q": "Выберите верные суждения о науке и запишите цифры, под которыми они указаны.", "ans": "1235", "opts": ["Наука способна прогнозировать последствия преобразовательной деятельности человека.", "Научные знания влияют на формирование мировоззрения человека.", "Наука вырабатывает и теоретически систематизирует объективные знания о природе, обществе, человеке.", "Наука и образование в современном обществе существуют обособленно друг от друга.", "Наука не только описывает природные или общественные явления, но и позволяет построить причинно-следственные связи между ними."], "expl": {"4": "Наука и образование тесно связаны: образование передаёт научные знания, вузы ведут исследования."}}, {"sec": "1.12", "num": "8", "type": 2, "kind": " дите два термина, «выпадающих» из общего ряда.", "ans": "12", "opts": ["стратификация", "традиционализм", "непрерывность", "гуманизация", "демократизация", "интернационализация"]}, {"sec": "1.13", "num": "2", "type": 2, "kind": "choice", "q": "Выберите верные суждения об образовании и запишите цифры, под которыми они указаны.", "ans": "125", "opts": ["Гуманизация образования предполагает ориентацию образовательной организации на интересы и склонности ученика.", "Образованием называют профессионально организованный процесс приобщения личности к ценностям и нормам культуры данного общества.", "Появление таких форм обучения как дистанционное образование, является проявлением тенденции интернационализации.", "Гуманитаризация образования проявляется в сокращении количества уроков по предметам обществоведческого цикла.", "В Российской Федерации гарантируется право каждого человека на образование."], "expl": {"3": "Дистанционное обучение — проявление информатизации; интернационализация — сближение систем образования разных стран.", "4": "Гуманитаризация — увеличение внимания к гуманитарным и общественным предметам."}}, {"sec": "1.13", "num": "3", "type": 2, "kind": "choice", "q": "Выберите верные суждения об образовании и запишите цифры, под которыми они указаны.", "ans": "134", "opts": ["Благодаря электронной почте и видеоконференциям школы могут устанавливать и поддерживать международные связи.", "Раньше внимание уделялось непрерывному образованию, а в настоящее время полная средняя школа обеспечивает достаточную образовательную подготовку.", "Демократизация образования проявляется в реализации принципа равных возможностей.", "К принципам государственной политики и правового регулирования отношений в сфере образования в России относят обеспечение прав на образование в течение всей жизни в соответствии с потребностями личности.", "Гуманизация образования предполагает обязательную компьютеризацию образовательного процесса."], "expl": {"2": "Сейчас образование непрерывно: человек учится всю жизнь, одной школы недостаточно.", "5": "Компьютеризация — информатизация; гуманизация — внимание к личности ученика."}}, {"sec": "1.13", "num": "4", "type": 2, "kind": "choice", "q": "Выберите верные суждения об образовании и запишите цифры, под которыми они указаны.", "ans": "234", "opts": ["Современное образование ориентируется на компетенции учащихся, и поэтому знания становятся ненужными.", "Гуманизация образования предполагает особое внимание к нравственному воспитанию учеников.", "Недопустимость ограничения или устранения конкуренции в сфере образования - один из принципов государственной политики и правового регулирования отношений в сфере образования в России.", "Образование обеспечивает передачу из поколения в поколение накопленных людьми духовных богатств.", "Гуманитаризация образования проявляется в сокращении учебного времени на историческое образование."], "expl": {"1": "Компетенции основаны на знаниях, знания не становятся ненужными.", "5": "Гуманитаризация — увеличение времени на гуманитарные предметы, в том числе историю."}}, {"sec": "1.13", "num": "5", "type": 2, "kind": "choice", "q": "Выберите верные суждения об образовании и запишите цифры, под которыми они указаны.", "ans": "124", "opts": ["Тенденция гуманитаризации проявляется в повышении внимания в учебном процессе к таким предметам, как история и право.", "Отличительной чертой современного образования становится его непрерывный характер.", "Гуманизация образования проявляется в увеличении количества учебных предметов, изучаемых школьниками.", "Гуманизация образования предполагает применение в обучении технологий, сберегающих здоровье учеников.", "Образование отличается от других форм (областей) духовной культуры тем, что оно способно оказывать эмоциональное воздействие на человека."], "expl": {"3": "Гуманизация — внимание к личности ученика, его интересам; количество предметов здесь ни при чём.", "5": "Эмоциональное воздействие свойственно искусству и религии, это не отличи еформа направлена на информатизацию образования?", "ans": "123", "opts": ["финансирование из государственного бюджета создания в сети Интернет единой системы, позволяющей учащимся самостоятельно проверить и оценить свой уровень знаний", "реализация программы использования технологий онлайн-уроков для организации обучения учащихся, находящихся на длительном лечении", "обеспечение школ современным компьютерным оборудованием для совершенствования образовательного процесса", "сокращение количества учебных предметов", "приоритетное внимание к интересам и склонностям личности обучающегося", "увеличение количества учебных предметов, относящихся к общественным дисциплинам"]}, {"sec": "1.13", "num": "20", "type": 4, "kind": "choice", "q": "Представьте, что Вы делаете презентацию к уроку обществознания по теме «Школьное образование в РФ». Один из слайдов называется «Обязанности обучающихся». Что из перечисленного следует включить в этот слайд?", "ans": "1245", "opts": ["бережно относиться к имуществу организации, осуществляющей образовательную деятельность", "уважать честь и достоинство других обучающихся и работников организации, осуществляющей образовательную деятельность", "выбирать факультативные и элективные учебные предметы, курсы, дисциплины", "заботиться о сохранении и об укреплении своего здоровья", "добросовестно осваивать образовательную программу, выполнять индивидуальный учебный план", "получать отсрочку от призыва на военную службу"]}, {"sec": "1.14", "num": "1", "type": 3, "kind": "match", "q": "Установите соответствие между признаками и формами (областями) культуры, которым они соответствуют.", "ans": "21211", "left": ["комплексное описание объекта", "познание мира с помощью слова, цвета и звука", "логическая стройность", "ярко выраженный субъективный характер", "образность и наглядность"], "right": ["искусство", "наука"], "rightH": "Формы (области) культуры"}, {"sec": "1.14", "num": "2", "type": 3, "kind": "match", "q": "Установите соответствие между признаками и формами (областями) культуры, которым они соответствуют.", "ans": "12211", "left": ["эстетические интерпретации объектов, явлений", "изучение закономерностей развития природы и общества", "стремление к достоверности и объективности", "субъективное (личностное) видение мира, индивидуальное, авторское постижение и отражение реальности", "значимость художественного вымысла"], "right": ["искусство", "наука"], "rightH": "Формы (области) культуры"}, {"sec": "1.14", "num": "3", "type": 3, "kind": "match", "q": "Установите соответствие между признаками и формами (областями) культуры, которым они соответствуют.", "ans": "21122", "left": ["обоснованность выводов", "эмоциональность", "аллегоричность", "уточняемость и дополняемость теорий в процессе появления новых фактов", "доказательность"], "right": ["искусство", "наука"], "rightH": "Формы (области) культуры"}, {"sec": "1.14", "num": "4", "type": 3, "kind": "match", "q": "Установите соответствие между признаками и формами (областями) культуры, для которых они характерны.", "ans": "12231", "left": ["познание объективных закономерностей развития природы и социума", "эстетическое освоение окружающего мира", "создание художественных образов", "вера в существование сакральной реальности", "проверяемость знаний"], "right": ["наука", "искусство", "религия"], "rightH": "Формы (области) культуры"}, {"sec": "1.14", "num": "5", "type": 1, "kind": "choice", "q": "Ниже приведён ряд терминов. Все они, за исключением двух, относятся к понятию «религия». Найдите два термина, «выпадающих» из общего ряда.", "ans": "23", "opts": ["культ", "системность", "художественный образ", "сверхъестественное", "многобожие", "индуизм"]}, {"sec": "1.14", "num": "6", "type": 2, "kind": "choice", "q": "Выберите верные суждения о религии и запишите цифры, под которыми они указаны.", "ans": "1235", "opts": ["Один из признаков религиозного сознания – убеждение в реальном существовании сверхъестественного, его влиянии на жизнь человека и общества.", "Религия оказывает эмоциональное воздействие на верующих.", "Религия даёт верующему человеку облегчение в страданиях, показывает выход из трудных, кажущихся безвыходными ситуаций.", "Религия, в отличие от других форм (областей) духовной культуры, объясняет события и явления окружающего мира.", "Религия помогает верующим найти ответы на жизненно важные вопросы."], "expl": {"4": "Объяснять события и явления мира способны также наука и мораль (оценка), это не отличие религии."}}, {"sec": "1.14", "num": "7", "type": 4, "kind": "choice", "q": "Представьте, что Вы делаете презентацию к уроку обществознания по теме «Религия как форма (область) духовной культуры». Один из слайдов называется «Мировые религии». Что из перечисленного необходимо включить в этот слайд? эти религии.", "ans": "125", "opts": ["буддизм", "христианство", "иудаизм", "даосизм", "ислам", "синтоизм"]}, {"sec": "1.14", "num": "8", "type": 4, "kind": "choice", "q": "Какие положения православия отражают регулятивную функцию этой христианской конфессии?", "ans": "345", "opts": ["почитание Иисуса Христа как Сына Божьего", "признание Евангелия священной книгой", "соблюдение Великого поста", "обязанность почитать своих отца и мать", "запрет приносить клятвы именем Бога", "вера в единого Бога"]}, {"sec": "1.15", "num": "1", "type": 1, "kind": "choice", "q": "Ниже приведён перечень характеристик. Все они, за исключением двух, относятся к характеристикам искусства. Найдите две характеристики, «выпадающие» из общего ряда.", "ans": "13", "opts": ["особая важность обряда и традиции", "образность", "достоверность и проверяемость результатов", "аллегоричность", "эмоциональность восприятия", "наглядность"]}, {"sec": "1.15", "num": "2", "type": 1, "kind": "choice", "q": "Ниже приведён ряд терминов. Все они, за исключением двух, представляют собой виды искусства. Найдите два термина «выпадающих» из общего ряда.", "ans": "36", "opts": ["поэзия", "балет", "концертный зал", "архитектура", "мультипликация", "галерея"]}, {"sec": "1.15", "num": "3", "type": 2, "kind": "choice", "q": "Выберите верные суждения об искусстве и запишите цифры, под которыми они указаны.", "ans": "235", "opts": ["Искусству свойственны системность и отсутствие субъективизма.", "В искусстве огромную роль играет воображение художника и зрителя.", "Воспитательная функция сопряжена с процессом социализации.", "Компенсаторная функция отражает задачу прогноза негативных проявлений материальной культуры.", "Искусство предполагает отражение действительности в художественных образах."], "expl": {"1": "Системность и объективность — признаки науки; искусство субъективно.", "4": "Компенсаторная функция — утешение, восстановление душевного равновесия; прогноз — функция науки."}}, {"sec": "1.15", "num": "4", "type": 2, "kind": "choice", "q": "Выберите верные суждения об искусстве и запишите цифры, под которыми они указаны.", "ans": "124", "opts": ["В основе искусства лежит образное отражение действительности.", "Искусство направлено на создание эстетических ценностей.", "Наука, в отличие от других форм (областей) духовной культуры, воздействует на эмоциональную сферу человека.", "Искусство влияет на мировоззрение личности.", "Роль искусства проявляется в оппонировании научным концепциям."], "expl": {"3": "Эмоциональное воздействие — признак искусства.", "5": "Роль искусства — эстетическое освоение мира; оппонирование научным концепциям не его задача."}}, {"sec": "1.15", "num": "5", "type": 2, "kind": "choice", "q": "Выберите верные суждения об искусстве и запишите цифры, под которыми они указаны.", "ans": "123", "opts": ["Искусство помогает привлечь внимание общества к социальным и нравственным проблемам.", "Искусство отражает действительность в образно-символической форме.", "Искусство оказывает эмоциональное воздействие на человека.", "Наука, как и другие формы духовной культуры, отражает действительность в художественных образах.", "Эстетическая функция искусства проявляется в предвосхищении модных тенденций в искусстве."], "expl":   });
  document.getElementById("rnd").onclick=()=>startQuiz(shuffle(TASKS).slice(0,10),"Случайные 10");
  document.getElementById("err").onclick=()=>{ const ts=TASKS.filter(t=>S.wrong[key(t)]); if(!ts.length){ haptic("success"); return; } startQuiz(ts,"Работа над ошибками"); };
  document.getElementById("p19").onclick=()=>show(()=>p19list());
  document.getElementById("shf").onchange=e=>{ S.shuffle=e.target.checked; save(); };
  document.getElementById("reset").onclick=()=>{
    document.getElementById("rc").innerHTML=`<div class="card"><b>Удалить весь прогресс?</b><div class="confirm"><button class="danger" id="yes">Удалить</button><button class="ghost" style="margin:0" id="no">Отмена</button></div></div>`;
    document.getElementById("yes").onclick=()=>{ S={done:{},wrong:{},p19:{},shuffle:S.shuffle}; save(); home(); };
    document.getElementById("no").onclick=()=>{ document.getElementById("rc").innerHTML=""; };
  };
  updBack();
}
function status(t){ const d=S.done[key(t)]; return d===undefined?"":(d===maxScore(t)?"ok":"bad"); }
function grid(list, cur){
  return `<div class="grid">${list.map((t,i)=>`<button class="gcell ${status(t)}${i===cur?" cur":""}" data-i="${i}" aria-label="Задание ${i+1}">${i+1}</button>`).join("")}</div>`;
}
function secScreen(sec){
  const name=SECTIONS.find(s=>s.sec===sec).name;
  const ts=TASKS.filter(t=>t.sec===sec), st=secStats(sec);
  $app.innerHTML = backBtn()+`<div class="card"><div class="muted">Часть 1 · ${ts.length} заданий</div><h2>${esc(name)}</h2>
    <div class="muted">Решено ${st.done} из ${st.n}${st.max?` · ${Math.round(st.pts/st.max*100)}% баллов`:""}</div>
    <button class="main" id="all">${S.shuffle?"Решать все (в случайном порядке)":"Решать все подряд"}</button></div>
    <div class="card"><div class="muted" style="margin-bottom:8px">Выберите задание</div>${grid(ts,-1)}
    <div class="legend"><span><i class="gcell ok"></i>верно</span><span><i class="gcell bad"></i>есть ошибки</span><span><i class="gcell"></i>не решено</span></div></div>`;
  wireBack();
  document.getElementById("all").onclick=()=>startQuiz(S.shuffle?shuffle(ts):ts,name);
  $app.querySelectorAll(".gcell[data-i]").forEach(c=>c.onclick=()=>startQuiz(ts,name,+c.dataset.i));
}
function shuffle(a){ a=a.slice(); for(let i=a.length-1;i>0;i--){const j=Math.floor(Math.random()*(i+1));[a[i],a[j]]=[a[j],a[i]];} return a; }

/* ---------- Решение заданий ---------- */
let Q = null; // {list, i, title, results:[]}
function startQuiz(list,title,start){ Q={list,i:start||0,title,results:[]}; show(()=>renderTask()); }
function renderTask(){
  const t=Q.list[Q.i];
  if(!t){ return renderSummary(); }
  const secName=SECTIONS.find(s=>s.sec===t.sec).name;
  let h = backBtn() + `<div class="card"><div class="qhead">${esc(Q.title)} · ${Q.i+1} из ${Q.list.length}<span class="tag">линия ${t.type}</span></div>
    <div class="bar"><i style="width:${Q.i/Q.list.length*100}%"></i></div>
    <div class="muted" style="margin:6px 0 10px">${secName!==Q.title?esc(secName)+" · ":""}№ ${esc(t.num)} в сборнике</div>
    <button class="jump" id="jmp">Выбрать задание ▾</button><div id="jg" hidden>${grid(Q.list,Q.i)}</div>
    <p class="q">${esc(t.q)}</p>`;
  if(t.kind==="choice"){
    h += t.opts.map((o,i)=>`<button class="opt" data-n="${i+1}"><span class="n">${i+1}</span><span class="body">${esc(o)}</span></button>`).join("");
  } else {
    h += `<div class="rlist"><div class="muted" style="margin-bottom:4px">${esc(t.rightH||"")}</div>${t.right.map((r,i)=>`<div><b>${i+1})</b> ${esc(r)}</div>`).join("")}</div>`;
    h += t.left.map((l,i)=>`<div class="mrow" data-i="${i}"><div class="l"><b>${LET[i]})</b>${esc(l)}</div><div class="chips">${t.right.map((r,j)=>`<button class="chip" data-v="${j+1}">${j+1}</button>`).join("")}</div></div>`).join("");
  }
  h += `<div id="res"></div><button class="main" id="chk" disabled>Проверить</button></div>`;
  $app.innerHTML=h; wireBack();
  const chk=document.getElementById("chk");
  let answered=false;
  document.getElementById("jmp").onclick=()=>{ const g=document.getElementById("jg"); g.hidden=!g.hidden; document.getElementById("jmp").textContent=g.hidden?"Выбрать задание ▾":"Скрыть список ▴"; };
  $app.querySelectorAll("#jg .gcell").forEach(c=>c.onclick=()=>{ Q.i=+c.dataset.i; renderTask(); window.scrollTo(0,0); });
  if(t.kind==="choice"){
    $app.querySelectorAll(".opt").forEach(o=>o.onclick=()=>{ if(answered) return; o.classList.toggle("sel"); chk.disabled=!$app.querySelector(".opt.sel"); });
  } else {
    $app.querySelectorAll(".mrow").forEach(r=>r.querySelectorAll(".chip").forEach(c=>c.onclick=()=>{
      if(answered) return; r.querySelectorAll(".chip").forEach(x=>x.classList.remove("sel")); c.classList.add("sel");
      chk.disabled=$app.querySelectorAll(".mrow .chip.sel").length<t.left.length;
    }));
  }
  chk.onclick=()=>{
    if(answered){ Q.i++; renderTask(); window.scrollTo(0,0); return; }
    answered=true;
    let user="", score=0;
    if(t.kind==="choice"){
      const sel=[...$app.querySelectorAll(".opt.sel")].map(o=>o.dataset.n);
      user=sel.join("");
      const right=new Set(t.ans.split("")), mine=new Set(sel);
      let err=0; right.forEach(x=>{ if(!mine.has(x)) err++; }); mine.forEach(x=>{ if(!right.has(x)) err++; });
      score = t.type===1 ? (err===0?1:0) : (err===0?2: err===1?1:0);
      $app.querySelectorAll(".opt").forEach(o=>{
        const n=o.dataset.n, isR=right.has(n), isS=mine.has(n);
        o.classList.remove("sel");
        if(isR&&isS) o.classList.add("ok"); else if(isR) o.classList.add("miss"); else if(isS) o.classList.add("bad");
        const ex = t.expl && t.expl[n];
        if(ex && !isR) o.querySelector(".body").insertAdjacentHTML("beforeend",`<span class="why">Почему неверно: ${esc(ex)}</span>`);
      });
    } else {
      let err=0;
      $app.querySelectorAll(".mrow").forEach((r,i)=>{
        const c=r.querySelector(".chip.sel"), v=c.dataset.v, rv=t.ans[i];
        user+=v;
        if(v===rv){ r.classList.add("ok"); c.classList.remove("sel"); c.classList.add("ok"); }
        else { err++; r.classList.add("bad"); c.classList.remove("sel"); c.classList.add("bad"); r.querySelector(`.chip[data-v="${rv}"]`).classList.add("ok"); }
      });
      score = err===0?2: err===1?1:0;
    }
    const mx=maxScore(t);
    S.done[key(t)]=score;
    if(score<mx) S.wrong[key(t)]=1; else delete S.wrong[key(t)];
    save(); Q.results.push({score,mx});
    const cls = score===mx?"ok":score>0?"part":"bad";
    const word = score===mx?"Верно!":score>0?"Почти: одна ошибка":"Неверно";
    let extra="";

    document.getElementById("res").innerHTML=`<div class="verdict ${cls}">${word} · ${score} из ${mx} ${mx===1?"балла":"баллов"}<small>Правильный ответ: <b>${t.ans}</b>${user!==t.ans?` · ваш ответ: ${user}`:""}</small></div>${extra}`;
    haptic(score===mx?"success":score>0?"warning":"error");
    chk.textContent = Q.i+1<Q.list.length ? "Дальше" : "Завершить";
  };
}
function renderSummary(){
  const pts=Q.results.reduce((a,r)=>a+r.score,0), mx=Q.results.reduce((a,r)=>a+r.mx,0);
  const full=Q.results.filter(r=>r.score===r.mx).length;
  $app.innerHTML = backBtn()+`<div class="card center"><div class="muted">${esc(Q.title)}</div><div class="big">${pts} / ${mx}</div><div>баллов · без ошибок ${full} из ${Q.results.length} заданий</div>
    <button class="main" id="again">Ещё раз</button><button class="ghost" id="toerr">Работа над ошибками</button><button class="ghost" id="tohome">На главную</button></div>`;
  wireBack();
  document.getElementById("again").onclick=()=>{ Q={list:S.shuffle?shuffle(Q.list):Q.list,i:0,title:Q.title,results:[]}; renderTask(); };
  document.getElementById("toerr").onclick=()=>{ const ts=TASKS.filter(t=>S.wrong[key(t)]); if(ts.length){ stack=[home]; startQuiz(ts,"Работа над ошибками"); } else home(); };
  document.getElementById("tohome").onclick=home;
}

/* ---------- Задание 19 ---------- */
function p19list(){
  let h = backBtn()+`<div class="card"><h2>Задание 19 · конкретные примеры</h2><p class="muted" style="margin:0">Напишите три примера, затем откройте образец и честно оцените себя: сколько ваших примеров верны и сформулированы развёрнуто.</p>
    <div style="margin-top:10px">${'<div class="grid">'+P19.map((x,k)=>`<button class="gcell ${S.p19[k]===undefined?"":(S.p19[k]===3?"ok":"bad")}" data-k="${k}">${k+1}</button>`).join("")+'</div>'}</div></div><div class="list">`;
  P19.forEach((p,i)=>{ const r=S.p19[i]; h+=`<button class="row" data-i="${i}"><div class="t"><div>${esc(p.topic)}</div><div>${esc(p.q)}</div></div><span class="muted">${r!==undefined? r+"/3":""}</span></button>`; });
  $app.innerHTML=h+`</div>`; wireBack();
  $app.querySelectorAll(".row[data-i]").forEach(b=>b.onclick=()=>show(()=>p19task(+b.dataset.i)));
  $app.querySelectorAll(".gcell[data-k]").forEach(b=>b.onclick=()=>show(()=>p19task(+b.dataset.k)));
}
function p19task(i){
  const p=P19[i];
  $app.innerHTML = backBtn()+`<div class="card"><div class="qhead">Задание 19 · ${i+1} из ${P19.length} · ${esc(p.topic)}</div>
    <button class="jump" id="jmp">Выбрать задание ▾</button><div id="jg" hidden><div class="grid">${P19.map((x,k)=>`<button class="gcell ${S.p19[k]===undefined?"":(S.p19[k]===3?"ok":"bad")}${k===i?" cur":""}" data-k="${k}">${k+1}</button>`).join("")}</div></div>
    <p class="q">${esc(p.q)}</p>
    <textarea id="ta" placeholder="1) …&#10;2) …&#10;3) …"></textarea>
    <button class="main" id="showS">Показать образец</button><div id="smp"></div></div>`;
  wireBack();
  document.getElementById("jmp").onclick=()=>{ const g=document.getElementById("jg"); g.hidden=!g.hidden; document.getElementById("jmp").textContent=g.hidden?"Выбрать задание ▾":"Скрыть список ▴"; };
  $app.querySelectorAll("#jg .gcell").forEach(c=>c.onclick=()=>{ stack.pop(); show(()=>p19task(+c.dataset.k)); });
  try{ const d=sessionStorage.getItem("p19draft"+i); if(d) document.getElementById("ta").value=d; }catch(e){}
  document.getElementById("ta").oninput=e=>{ try{ sessionStorage.setItem("p19draft"+i,e.target.value); }catch(_){} };
  document.getElementById("showS").onclick=()=>{
    document.getElementById("showS").style.display="none";
    document.getElementById("smp").innerHTML=`<div class="sample"><b>Образец ответа</b><ol>${p.a.map(x=>`<li>${esc(x)}</li>`).join("")}</ol>
      <div class="muted" style="margin-top:6px">Пример засчитывается, если он конкретный (есть кто, что сделал, где/когда) и сформулирован развёрнутым предложением.</div></div>
      <div class="selfcheck"><div class="muted">Сколько ваших примеров верны?</div><div class="chips" style="margin-top:6px">${[0,1,2,3].map(v=>`<button class="chip" data-v="${v}">${v}</button>`).join("")}</div></div>
      <button class="ghost" id="nx">${i+1<P19.length?"Следующее задание":"К списку"}</button>`;
    $app.querySelectorAll(".selfcheck .chip").forEach(c=>c.onclick=()=>{ $app.querySelectorAll(".selfcheck .chip").forEach(x=>x.classList.remove("sel")); c.classList.add("sel"); S.p19[i]=+c.dataset.v; save(); haptic(+c.dataset.v===3?"success":"warning"); });
    document.getElementById("nx").onclick=()=>{ if(i+1<P19.length){ stack.pop(); show(()=>p19task(i+1)); } else back(); };
  };
}

home();
</script>
